openapi: 3.0.3
info:
  title: Object Storage API
  description: |
    ## Regions
    | Code | Region | Zone | Type | Endpoint |
    |------|--------|------|------|----------|
    | ir-thr-at1 | ir-central1 | Simin | STANDARD | https://s3.ir-thr-at1.arvanstorage.ir |
    | ir-pym-hd1 | ir-central1 | Bamdad | HI_OPS | https://hot.ir-central1.arvanstorage.ir |
    | ir-tbz-sh1 | ir-north-west | Shahriar | STANDARD | https://s3.ir-tbz-sh1.arvanstorage.ir |

    ## Error Codes

    | Code | Description |
    |------|-------------|
    | USER_IS_DEBTOR | User has insufficient balance |
    | VALIDATION_REQUIRED | Field is required |
    | VALIDATION_REQUIRED_IF | Field is required if another field has a specific value |
    | VALIDATION_REQUIRED_WITH | Field is required when another field is present |
    | VALIDATION_REQUIRED_UNLESS | Field is required unless another field has a specific value |
    | VALIDATION_REQUIRED_WITHOUT | Field is required when another field is not present |
    | VALIDATION_EXCLUDED_IF | Field must be excluded if another field has a specific value |
    | VALIDATION_EXCLUDED_WITH | Field must be excluded when another field is present |
    | VALIDATION_EXCLUDED_UNLESS | Field must be excluded unless another field has a specific value |
    | VALIDATION_EXCLUDED_WITHOUT | Field must be excluded when another field is not present |
    | VALIDATION_UNIQUE | Field value must be unique |
    | VALIDATION_MIN_LENGTH | Field value is shorter than minimum length |
    | VALIDATION_MAX_LENGTH | Field value exceeds maximum length |
    | VALIDATION_LENGTH | Field value length is invalid |
    | VALIDATION_MIN | Field value is less than minimum |
    | VALIDATION_MAX | Field value exceeds maximum |
    | VALIDATION_NUMERIC | Field must be numeric |
    | VALIDATION_STRING | Field must be a string |
    | VALIDATION_INTEGER | Field must be an integer |
    | VALIDATION_BOOL | Field must be a boolean |
    | VALIDATION_GT | Field value must be greater than specified value |
    | VALIDATION_GTE | Field value must be greater than or equal to specified value |
    | VALIDATION_LT | Field value must be less than specified value |
    | VALIDATION_LTE | Field value must be less than or equal to specified value |
    | VALIDATION_EQ | Field value must equal specified value |
    | VALIDATION_NEQ | Field value must not equal specified value |
    | VALIDATION_IN | Field value must be one of the specified values |
    | VALIDATION_NIN | Field value must not be one of the specified values |
    | VALIDATION_GT_FIELD | Field value must be greater than another field's value |
    | VALIDATION_GTE_FIELD | Field value must be greater than or equal to another field's value |
    | VALIDATION_LT_FIELD | Field value must be less than another field's value |
    | VALIDATION_LTE_FIELD | Field value must be less than or equal to another field's value |
    | VALIDATION_EQ_FIELD | Field value must equal another field's value |
    | VALIDATION_NEQ_FIELD | Field value must not equal another field's value |
    | VALIDATION_IN_FIELD | Field value must be one of another field's values |
    | VALIDATION_NIN_FIELD | Field value must not be one of another field's values |
    | VALIDATION_ALPHA | Field must contain only alphabetic characters |
    | VALIDATION_ALPHA_UNICODE | Field must contain only unicode alphabetic characters |
    | VALIDATION_ALPHA_NUM | Field must contain only alphanumeric characters |
    | VALIDATION_ALPHA_DASH | Field must contain only alphanumeric characters, dashes and underscores |
    | VALIDATION_ASCII | Field must contain only ASCII characters |
    | VALIDATION_CONTAINS | Field must contain the specified substring |
    | VALIDATION_STARTS_WITH | Field must start with the specified prefix |
    | VALIDATION_ENDS_WITH | Field must end with the specified suffix |
    | VALIDATION_LOWER_CASE | Field must be lowercase |
    | VALIDATION_UPPER_CASE | Field must be uppercase |
    | VALIDATION_SNAKE_CASE | Field must be in snake_case format |
    | VALIDATION_KEBAB_CASE | Field must be in kebab-case format |
    | VALIDATION_UUID | Field must be a valid UUID |
    | VALIDATION_UUID1 | Field must be a valid UUID v1 |
    | VALIDATION_UUID3 | Field must be a valid UUID v3 |
    | VALIDATION_UUID4 | Field must be a valid UUID v4 |
    | VALIDATION_UUID5 | Field must be a valid UUID v5 |
    | VALIDATION_REGEX | Field must match the specified regular expression |
    | VALIDATION_CIDR | Field must be a valid CIDR |
    | VALIDATION_CIDR_V4 | Field must be a valid IPv4 CIDR |
    | VALIDATION_CIDR_V6 | Field must be a valid IPv6 CIDR |
    | VALIDATION_IP | Field must be a valid IP address |
    | VALIDATION_IPV4 | Field must be a valid IPv4 address |
    | VALIDATION_IPV6 | Field must be a valid IPv6 address |
    | VALIDATION_EMAIL | Field must be a valid email address |
    | VALIDATION_TLD | Field must be a valid top-level domain |
    | VALIDATION_FQDN | Field must be a valid fully qualified domain name |
    | VALIDATION_HOSTNAME | Field must be a valid hostname |
    | VALIDATION_URL | Field must be a valid URL |
    | VALIDATION_URI | Field must be a valid URI |
    | VALIDATION_FILE | Field must be a valid file path |
    | VALIDATION_MIME_TYPE | Field must be a valid MIME type |
    | VALIDATION_FILE_SIZE | Field must be a valid file size |
    | VALIDATION_RFC_3339 | Field must be a valid RFC3339 date-time |
    | INVALID_SCHEMA | The request schema is invalid |
    | ANTIVIRUS_NOT_CONFIGURED | The antivirus service is not configured for the bucket |
    | NO_ANTIVIRUS_ENGINE_ENABLED | No antivirus engine is enabled for scanning |
    | TOO_MANY_ANTIVIRUTS_REQUEST | Too many antivirus scan requests have been made |
    | NO_SCANNABLE_FILES_EXIST | No files exist that can be scanned |
    | ANTIVIRUS_IS_DISABLE | The antivirus service is currently disabled |
    | BUCKET_TAGS_LIMIT | Bucket tags limit exceeded |
    | TOO_MANY_BUCKETS | Bucket quota exceeded |
    | BUCKET_NOT_EMPTY | The bucket is not empty |
    | TOO_MANY_OBJECTS | Object quota exceeded |
    | REPLICATION_RULE_IS_DISABLE | The replication rule is disabled |
    | REPLICATION_QUOTA_EXCEEDED | Replication maximum capacity reached |
    | TEMP_USER_INVALID_EXPIRE_TIME | Invalid expiration time for temporary user |
    | MULTI_ZONE_NOT_AVAILABLE_IN_CLUSTER | Multi-zone is not available in this cluster |
    | REPLICATION_INCORRECT_STATUS_FOR_DETECT | Detection allowed only on `NEED_DETECT` and `DETECTING_FAILED` status |
    | REPLICATION_INCORRECT_STATUS_FOR_SYNC | Sync allowed only on `SYNC_FAILED` and `UNSYNC` status |
    | REPLICATION_SYNC_TOO_MANY_REQUEST | You can send request 2 hours after previous request |
    | LOCK_DISABLED_FOR_REGION | Object lock feature disable in this region |
    | LOCK_IS_NOT_ENABLED_FOR_BUCKET | Object lock is not enabled for this bucket |
    | MAINTENANCE | This service is temporarily unavailable due to scheduled maintenance. |
    | BUCKET_CATALOG_QUOTA_EXCEEDED | Bucket Catalog Quota Exceeded |
    | CATALOG_ENGINE_QUOTA_EXCEEDED | Catalog Engine Quota Exceeded |
    | CATALOG_ENGINE_IP_NOT_FOUND | Catalog Engine IP Not Found |
    | CATALOG_ENGINE_CREDENTIALS_NOT_FOUND | Catalog Engine Credentials Not Found |
    | INSUFFICIENT_RESOURCES | Insufficient Resources |
    | CATALOG_ENGINE_NAMESPACE_QUOTA_EXCEEDED | Catalog Engine Namespace Quota Exceeded |
    | TOO_MANY_MACHINE_USER | Too Many Machine User |
  version: 1.0.0
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://storage.arvanapis.ir
security:
  - ApiKey: []
tags:
  - name: Access Points
    description: Operations for managing access points to multiple buckets
  - name: Anti Virus
    description: Operations related to antivirus scanning and configurations
  - name: Bucket Catalog
    description: Operations related to bucket catalog management
  - name: Query Engine
    description: Operations related to query engine management
  - name: Bucket Downloads
    description: Operations related to bucket downloads
  - name: Buckets
    description: Operations related to bucket management
  - name: Replications
    description: Operations related to replication configuration
  - name: Reports
    description: Show multiple reports about usages
  - name: Temp Users
    description: Operations for managing temporary users with limited access
  - name: Upload
    description: Operations related to upload
  - name: Users
    description: Operations related to user management
paths:
  /v1/access-points:
    get:
      tags:
        - Access Points
      summary: List access points
      description: Returns a list of all access points owned by the authenticated user
      parameters:
        - name: perPage
          in: query
          description: Number of items to return per page
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: q
          in: query
          description: Search keyword for access point names
          schema:
            type: string
      responses:
        '200':
          description: List of access points
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedListResponse'
                  - type: object
                    properties:
                      message:
                        example: access points list
                      data:
                        $ref: '#/components/schemas/AccessPointList'
        '401':
          $ref: '#/components/responses/standard401'
    post:
      tags:
        - Access Points
      summary: Create an access point
      description: Creates a new access point with the provided configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccessPointRequest'
      responses:
        '201':
          description: Access point created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: access point created successfully
                      data:
                        $ref: '#/components/schemas/CreatedResourceResponse'
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - type: object
                    properties:
                      message:
                        example: Validation failed
                      errors:
                        type: array
                        items:
                          $ref: '#/components/schemas/ErrorItem'
  /v1/access-points/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the access point
        schema:
          type: string
    get:
      tags:
        - Access Points
      summary: Get access point details
      description: Returns details about a specific access point
      responses:
        '200':
          description: Access point details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: access point
                      data:
                        $ref: '#/components/schemas/AccessPoint'
        '401':
          $ref: '#/components/responses/standard401'
    delete:
      tags:
        - Access Points
      summary: Delete an access point
      description: Deletes a specific access point
      responses:
        '204':
          description: Access point deleted successfully
        '401':
          $ref: '#/components/responses/standard401'
  /v1/av:
    get:
      tags:
        - Anti Virus
      summary: List antivirus settings
      description: Returns a list of all antivirus settings owned by the authenticated user
      parameters:
        - name: perPage
          in: query
          description: Number of items to return per page
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: List of antivirus settings
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedListResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AVSettingList'
                      meta:
                        type: object
                        properties:
                          pagination:
                            $ref: '#/components/schemas/OffsetPagination'
        '401':
          $ref: '#/components/responses/standard401'
    post:
      tags:
        - Anti Virus
      summary: Create antivirus setting
      description: Creates a new antivirus setting for a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAVSettingsRequest'
      responses:
        '201':
          description: Antivirus setting created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: av settings created successfully
                      data:
                        $ref: '#/components/schemas/CreatedResourceResponse'
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/av/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the antivirus setting
        schema:
          type: string
    get:
      tags:
        - Anti Virus
      summary: Get antivirus settings
      description: Returns details about a specific antivirus setting
      responses:
        '200':
          description: Antivirus setting details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AVSetting'
        '401':
          $ref: '#/components/responses/standard401'
    put:
      tags:
        - Anti Virus
      summary: Update antivirus setting
      description: Updates an existing antivirus setting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAVSettingsRequest'
      responses:
        '200':
          description: Antivirus setting updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: av settings updated successfully
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/av/{id}/scan:
    parameters:
      - name: id
        in: path
        required: true
        description: Id of antivirus setting
        schema:
          type: string
    post:
      tags:
        - Anti Virus
      summary: Scan objects
      description: Initiates an antivirus scan for specific objects in a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AVScanRequest'
      responses:
        '200':
          description: Scan initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/av/{id}/scans-summary:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the antivirus setting
        schema:
          type: string
    get:
      tags:
        - Anti Virus
      summary: Get antivirus scan summary
      description: Returns details about a specific antivirus scan summary
      responses:
        '200':
          description: Antivirus av scan summary
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketAVScanSummary'
        '401':
          $ref: '#/components/responses/standard401'
  /v1/av/{id}/scans-statistics:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the antivirus setting
        schema:
          type: string
    get:
      tags:
        - Anti Virus
      summary: Get antivirus scan statistics
      description: Returns details about a specific antivirus scan statistics
      responses:
        '200':
          description: Antivirus av scan statistics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketAVScanStatistics'
        '401':
          $ref: '#/components/responses/standard401'
  /v1/bucket-downloads:
    get:
      tags:
        - Bucket Downloads
      summary: List bucket downloads
      description: Returns a list of all bucket downloads for the authenticated user
      parameters:
        - name: perPage
          in: query
          description: Number of items to return per page
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: List of bucket downloads
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketDownloadList'
                      meta:
                        type: object
                        properties:
                          pagination:
                            $ref: '#/components/schemas/OffsetPagination'
        '401':
          $ref: '#/components/responses/standard401'
    post:
      tags:
        - Bucket Downloads
      summary: Create bucket download
      description: Creates a new bucket download configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketDownloadRequest'
      responses:
        '201':
          description: Bucket download created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: bucket download created successfully
                      data:
                        $ref: '#/components/schemas/CreatedResourceResponse'
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/bucket-downloads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID of the bucket download
        schema:
          type: string
    get:
      tags:
        - Bucket Downloads
      summary: Get bucket download
      description: Returns details of a specific bucket download
      responses:
        '200':
          description: Bucket download details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketDownload'
        '401':
          $ref: '#/components/responses/standard401'
    put:
      tags:
        - Bucket Downloads
      summary: Update bucket download
      description: Updates an existing bucket download configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketDownloadRequest'
      responses:
        '200':
          $ref: '#/components/responses/success'
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Bucket Downloads
      summary: Delete bucket download
      description: Deletes a bucket download configuration
      responses:
        '204':
          description: Bucket download deleted successfully
        '401':
          $ref: '#/components/responses/standard401'
  /v1/buckets:
    get:
      tags:
        - Buckets
      summary: List buckets
      description: Returns a list of buckets owned by or shared with the authenticated user
      parameters:
        - name: status
          in: query
          description: Filter buckets by status
          schema:
            type: string
            enum:
              - all
              - shared
              - owned
            default: all
        - name: perPage
          in: query
          description: Number of items to return per page
          schema:
            type: integer
            default: 20
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: List of buckets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketSummaryList'
        '401':
          $ref: '#/components/responses/standard401'
    post:
      tags:
        - Buckets
      summary: Create bucket
      description: Creates a new bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBucketRequest'
      responses:
        '201':
          description: Bucket created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketInfo'
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/buckets/{bucketName}:
    parameters:
      - name: bucketName
        in: path
        required: true
        description: Name of the bucket
        schema:
          type: string
    get:
      tags:
        - Buckets
      summary: Get bucket details
      description: Returns details about a specific bucket
      parameters:
        - name: X-AR-View-Type
          in: query
          description: Type of view to return
          schema:
            type: string
            enum:
              - info
              - metrics
            default: info
      responses:
        '200':
          description: Bucket details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        oneOf:
                          - $ref: '#/components/schemas/BucketInfo'
                          - $ref: '#/components/schemas/BucketMetrics'
        '401':
          $ref: '#/components/responses/standard401'
    delete:
      tags:
        - Buckets
      summary: Delete bucket
      description: Deletes a bucket
      responses:
        '204':
          description: Bucket deleted successfully
        '401':
          $ref: '#/components/responses/standard401'
  /v1/buckets/{bucketName}/versioning:
    parameters:
      - name: bucketName
        in: path
        required: true
        description: Name of the bucket
        schema:
          type: string
    get:
      tags:
        - Buckets
      summary: Get bucket versioning
      description: Returns the versioning state of a bucket
      responses:
        '200':
          description: Bucket versioning state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketVersioning'
        '401':
          $ref: '#/components/responses/standard401'
    post:
      tags:
        - Buckets
      summary: Update bucket versioning
      description: Updates the versioning state of a bucket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBucketVersioningRequest'
      responses:
        '202':
          description: Versioning state updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Versioning status updated successfully
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/buckets/{bucketName}/enable-multi-zone:
    parameters:
      - name: bucketName
        in: path
        required: true
        description: Name of the bucket
        schema:
          type: string
    post:
      tags:
        - Buckets
      summary: Enable bucket multi-zone
      description: Enable multi-zone for a bucket
      responses:
        '202':
          description: Multi-zone enabled successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Multi-zone enabled successfully
        '401':
          $ref: '#/components/responses/standard401'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/reports/storage:
    get:
      tags:
        - Reports
      summary: Storage usage
      description: Returns storage usage reports for account or specific bucket/region
      parameters:
        - name: reportDate
          in: query
          description: Date for which to get reports
          schema:
            type: string
            format: date-time
        - name: bucket
          in: query
          description: Bucket name to filter reports
          schema:
            type: string
        - name: region
          in: query
          description: Region to filter reports
          schema:
            type: string
      responses:
        '200':
          description: Storage usage reports
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
