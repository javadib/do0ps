components:
  securitySchemes:
    ApiKey:
      type: apiKey
      name: authorization
      in: header
  schemas:
    OffsetPagination:
      type: object
      required:
        - current
        - perPage
        - totalItems
        - lastPage
      properties:
        perPage:
          type: integer
          format: int64
          description: Number of items per page
          example: 20
        current:
          type: integer
          format: int64
          description: Current page number
          example: 1
        totalItems:
          type: integer
          format: int64
          description: Total number of items
          example: 100
        lastPage:
          type: integer
          format: int64
          description: Last page number
          example: 5
        next:
          type: integer
          format: int64
          nullable: true
          description: Next page number if available
          example: 2
        previous:
          type: integer
          format: int64
          nullable: true
          description: Previous page number if available
          example: null
    PaginatedListResponse:
      type: object
      properties:
        message:
          type: string
          description: A human-readable message about the response
          example: Operation completed successfully
        data:
          type: object
        meta:
          type: object
          required:
            - pagination
          properties:
            pagination:
              $ref: '#/components/schemas/OffsetPagination'
    ApSourceForList:
      type: object
      required:
        - bucket
        - region
      properties:
        bucketName:
          type: string
          description: Name of the bucket
          example: my-bucket
        region:
          type: string
          description: Region where the bucket is located
          enum:
            - ir-central1
            - ir-northwest1
          example: ir-central1
    AccessPointForList:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the access point
          example: a7f147d7-474d-53de-8f98-25ceaaaac5d1
        name:
          type: string
          description: Name of the access point
          example: backend-files
        domain:
          type: string
          description: Domain for accessing the access point
          example: backend-files.s3.ir-central1.arvanstorage.com
        createDate:
          type: string
          format: date-time
          description: Creation date of the access point in RFC3339 format
          example: '2023-01-15T14:30:00Z'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ApSourceForList'
    AccessPointList:
      type: array
      items:
        $ref: '#/components/schemas/AccessPointForList'
    ErrorMessage:
      allOf:
        - type: object
          properties:
            message:
              type: string
              description: A human-readable message about the response
              example: Operation Failed
    CreateAccessPointRequest:
      type: object
      required:
        - name
        - buckets
      properties:
        name:
          type: string
          description: Name for the access point
          example: backend-files
        buckets:
          type: array
          items:
            type: string
          description: List of buckets to include in this access point
    SuccessResponse:
      allOf:
        - type: object
          properties:
            message:
              example: Operation completed successfully
            data:
              type: object
              description: Response data content (varies by endpoint)
    CreatedResourceResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the created resource
          example: a7f147d7-474d-53de-8f98-25ceaaaac5d1
    ErrorItem:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          description: Error reason code as an enumeration that defined in the error codes section
          example: VALIDATION_REQUIRED
        field:
          type: string
          description: Field name associated with the error
          example: bucket
        params:
          type: object
          description: Additional parameters related to the error
    ErrorResponse:
      allOf:
        - type: object
          properties:
            message:
              type: string
              description: A human-readable message about the response
              example: Operation Failed
            errors:
              type: array
              description: Array of error objects if any
              items:
                $ref: '#/components/schemas/ErrorItem'
    ApSource:
      type: object
      required:
        - bucket
        - region
      properties:
        weight:
          type: integer
          nullable: true
          description: Weight of this source (for load balancing)
          example: 10
        status:
          type: boolean
          nullable: true
          description: Status of this source (active/inactive)
          example: true
        bucketName:
          type: string
          description: Name of the bucket
          example: my-bucket
        region:
          type: string
          description: Region where the bucket is located
          enum:
            - ir-central1
            - ir-northwest1
          example: ir-central1
    AccessPoint:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the access point
          example: a7f147d7-474d-53de-8f98-25ceaaaac5d1
        name:
          type: string
          description: Name of the access point
          example: backend-files
        domain:
          type: string
          description: Domain for accessing the access point
          example: backend-files.s3.ir-central1.arvanstorage.com
        createDate:
          type: string
          format: date-time
          description: Creation date of the access point in RFC3339 format
          example: '2023-01-15T14:30:00Z'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ApSource'
    AVSetting:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier of the antivirus setting
          example: a7f147d7-474d-53de-8f98-25ceaaaac5d1
        createDate:
          type: string
          format: date-time
          description: Creation date of the antivirus setting in RFC3339 format
          example: '2023-01-15T14:30:00Z'
        updateDate:
          type: string
          format: date-time
          description: Last update date of the antivirus setting in RFC3339 format
          example: '2023-01-16T10:15:00Z'
        bucket:
          type: string
          description: Name of the bucket to which this antivirus setting applies
          example: my-bucket
        region:
          type: string
          description: Region where the bucket is located
          enum:
            - ir-central1
            - ir-northwest1
          example: ir-central1
        engines:
          type: array
          description: List of antivirus engines enabled for this setting
          items:
            type: string
            enum:
              - AVAST
              - PADVISH
              - QUICKHEAL
              - DRWEB
              - AVIRA
          example:
            - KASPERSKY
            - PADVISH
        enabled:
          type: boolean
          description: Whether the antivirus setting is enabled
          example: true
        scanOnUpload:
          type: boolean
          description: Whether to scan files on upload
          example: true
    AVSettingList:
      type: array
      items:
        $ref: '#/components/schemas/AVSetting'
    CreateAVSettingsRequest:
      type: object
      required:
        - bucket
        - engines
      properties:
        bucket:
          type: string
          description: Name of the bucket to which this antivirus setting applies
          example: my-bucket
        engines:
          type: array
          description: List of antivirus engines to enable
          minItems: 1
          items:
            type: string
            enum:
              - AVAST
              - PADVISH
              - QUICKHEAL
              - DRWEB
              - AVIRA
          example:
            - KASPERSKY
            - PADVISH
        enabled:
          type: boolean
          description: Whether to enable the antivirus setting
          default: false
          example: true
        scanOnUpload:
          type: boolean
          description: Whether to scan files on upload
          default: false
          example: true
    UpdateAVSettingsRequest:
      type: object
      properties:
        engines:
          type: array
          description: List of antivirus engines to enable
          minItems: 1
          items:
            type: string
            enum:
              - AVAST
              - PADVISH
              - QUICKHEAL
              - DRWEB
              - AVIRA
          example:
            - KASPERSKY
            - PADVISH
        enabled:
          type: boolean
          description: Whether to enable the antivirus setting
          example: true
        scanOnUpload:
          type: boolean
          description: Whether to scan files on upload
          example: true
    ScanNowObj:
      type: object
      required:
        - name
        - etag
      properties:
        name:
          type: string
          description: Name of the object to scan
          example: document.pdf
        etag:
          type: string
          description: ETag of the object to scan
          example: 686897696a7c876b7e
    AVScanRequest:
      type: object
      required:
        - objects
      properties:
        objects:
          type: array
          description: List of objects to scan
          minItems: 1
          items:
            $ref: '#/components/schemas/ScanNowObj'
    BucketAVScanSummary:
      type: object
      properties:
        objectsCount:
          type: integer
          format: int64
          description: Total number of objects in the bucket
          example: 100
        size:
          type: integer
          format: int64
          description: Total size of objects in the bucket in bytes
          example: 1073741824
        ObjectsNeedScanCount:
          type: integer
          description: Number of objects that need scanning
          example: 20
        objectsNeedScanBytes:
          type: integer
          description: Total size of objects that need scanning in bytes
          example: 104857600
        safeObjectsCount:
          type: integer
          description: Number of objects marked as safe
          example: 70
        unsafeObjectsCount:
          type: integer
          description: Number of objects marked as unsafe
          example: 0
        objectsInScanCount:
          type: integer
          description: Number of objects currently being scanned
          example: 5
        unscannableObjectsCount:
          type: integer
          description: Number of objects that cannot be scanned
          example: 5
        notScannedObjects:
          type: integer
          description: Number of objects not yet scanned
          example: 0
    BucketAVScanStatistics:
      type: array
      items:
        type: object
        properties:
          fileName:
            type: string
            description: Name of the file
          additionalProperties:
            type: string
        description: Statistics about scanned files by antivirus engine
        example:
          fileName: test.txt
          kaspersky: clean
          padvish: scanning
    BucketDownload:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the bucket download
          example: a7f147d7-474d-53de-8f98-25ceaaaac5d1
        name:
          type: string
          description: Name of the bucket download
          example: Project Downloads
        color:
          type: string
          description: Color theme for the download page
          enum:
            - YELLOW
            - WHITE
            - GREEN
            - ORANGE
            - BLUE
            - BLACK
            - GREY
          example: YELLOW
        bucket:
          type: string
          description: Name of the bucket
          example: my-bucket
        domain:
          type: string
          description: Domain for accessing the download page
          example: download.example.com
        subDomain:
          type: string
          description: Subdomain for the download page
          example: files
        region:
          type: string
          enum:
            - ir-central1
            - ir-northwest1
          description: Region where the bucket is located
          example: ir-central1
        sortBy:
          type: string
          description: Field to sort files by
          enum:
            - NAME
            - DATE
            - SIZE
          example: NAME
        sortOrder:
          type: string
          description: Sort direction
          enum:
            - ASC
            - DESC
          example: ASC
        createDate:
          type: string
          format: date-time
          description: Creation date in RFC3339 format
          example: '2023-01-15T14:30:00Z'
    BucketDownloadList:
      type: array
      items:
        $ref: '#/components/schemas/BucketDownload'
    CreateBucketDownloadRequest:
      type: object
      required:
        - name
        - bucket
        - color
        - domain
        - subDomain
        - sortBy
        - sortOrder
      properties:
        name:
          type: string
          description: Name of the bucket download
          maxLength: 40
          example: Project Downloads
        bucket:
          type: string
          description: Name of the bucket
          example: my-bucket
        color:
          type: string
          description: Color theme for the download page
          enum:
            - YELLOW
            - WHITE
            - GREEN
            - ORANGE
            - BLUE
            - BLACK
            - GREY
          example: YELLOW
        domain:
          type: string
          description: Domain for accessing the download page
          example: download.example.com
        subDomain:
          type: string
          description: Subdomain for the download page
          example: files
        sortBy:
          type: string
          description: Field to sort files by
          enum:
            - NAME
            - DATE
            - SIZE
          example: NAME
        sortOrder:
          type: string
          description: Sort direction
          enum:
            - ASC
            - DESC
          example: ASC
        isPublic:
          type: boolean
          description: Whether the download page is publicly accessible
          default: false
          example: true
    UpdateBucketDownloadRequest:
      allOf:
        - $ref: '#/components/schemas/CreateBucketDownloadRequest'
    BucketSummary:
      type: object
      properties:
        createDate:
          type: string
          format: date-time
          nullable: true
          description: Creation date in RFC3339 format
