          example: cluster-123456
      - name: configId
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier for the engine config
          example: config-789012
    delete:
      summary: Drop an engine configuration
      tags:
        - Query Engine
      responses:
        '204':
          description: Engine config dropped successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        type: string
                        example: engine config dropped successfully
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/standard401'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/engine-clusters/{id}/api-key:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Unique identifier for the engine cluster
          example: cluster-123456
    post:
      summary: Create an API key for an engine cluster
      tags:
        - Query Engine
      responses:
        '201':
          description: API key created successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          apiKey:
                            type: string
                            description: The generated API key
                            example: ak-1234567890abcdef
                      message:
                        type: string
                        example: API key created successfully
        '400':
          $ref: '#/components/responses/badRequest'
        '401':
          $ref: '#/components/responses/standard401'
        '404':
          $ref: '#/components/responses/notFound'
        '422':
          description: Validation Required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/buckets/{bucketName}/lock:
    parameters:
      - name: bucketName
        in: path
        required: true
        description: Name of the bucket
        schema:
          type: string
    put:
      tags:
        - Buckets
      summary: Update bucket object lock retention
      description: Update bucket object lock retention
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BucketLockConfigPayload'
      responses:
        '200':
          description: Bucket object lock configurations updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Object lock configurations updated successfully
        '409':
          description: Bucket lock is not enabled for this bucket
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      message:
                        example: Bucket lock is not enabled for this bucket
    get:
      tags:
        - Buckets
      summary: Get bucket object lock status
      description: Get bucket object lock status
      responses:
        '200':
          description: Get bucket object lock status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BucketLockConfig'
