                    description: Created
                "402":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.KitError'
                    description: Payment Required
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.KitError'
                    description: Unprocessable Entity
                default:
                    description: ""
            summary: Create New Firewall Rule
            tags:
                - Firewalls
    /firewalls/{firewallId}/rules/batch-delete:
