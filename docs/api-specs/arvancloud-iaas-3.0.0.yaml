info:
    contact:
        email: callcenter@arvancloud.ir
        name: API Support
    description: |
        Welcome to the official documentation for the Arvancloud Infrastructure as a Service (IaaS) API.

        This API allows you to interact programmatically with Arvancloud’s IaaS platform. You can manage compute resources such as virtual machines (VMs), storage, networking, and security groups, as well as perform various administrative tasks.

        The documentation provides all the details you need to authenticate, interact with, and utilize the API effectively. Whether you're building automation tools, integrating Arvancloud into your existing workflows, or managing resources through a third-party platform, this API offers everything you need to get started.

        This documentation covers the **latest version** of the Arvancloud IaaS API, with all the latest features, improvements, and bug fixes.

        For any questions or assistance, please refer to our support team or community forums.
    title: Arvancloud IaaS API Documentation
    version: v3.0.1
openapi: 3.0.0
paths:
    /availability-zones:
        get:
            description: List availability zones in a region
            operationId: ListAvailabilityZones
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.KitResponse-array_response_StandardDataCenter'
                    description: OK
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.KitError'
                    description: Unprocessable Entity
                default:
                    description: ""
            summary: List availability zones in a region
            tags:
                - Availability Zones
    /firewalls:
        get:
            description: List all firewalls of the tenant within the region
            operationId: ListFirewalls
            parameters:
                - description: Page number
                  in: query
                  name: page
                  schema:
                    type: integer
                - description: Items per page
                  in: query
                  name: perPage
                  schema:
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
