servers:
    - description: Cloud Server APIs
      url: https://ecc.[region].arvanapis.ir/v3
tags:
    - description: |
        Welcome to the API documentation! This section provides an overview of how to use the API, including details on filtering, sorting, and pagination.

        ## Filtering

        The API allows you to filter results based on specific fields and conditions. Filtering helps you narrow down results to match your criteria.

        ### How to Filter Data

        Filters are applied in the URL query string using the following format:

        ```
        /path/to/resources?{field}={operator}:{value}
        ```

        - `{field}`: The field you want to filter by (e.g., `status`, `createDate`).
        - `{operator}`: The comparison operator (e.g., `eq`, `gt`, `lte`).
        - `{value}`: The value to compare against.

        ### Supported Operators

        Here are the available operators for filtering:

        - **`eq`**: Equals to (e.g., `field=eq:value`)
        - **`neq`**: Not equals to (e.g., `field=neq:value`)
        - **`gt`**: Greater than (e.g., `field=gt:value`)
        - **`gte`**: Greater than or equal to (e.g., `field=gte:value`)
        - **`lt`**: Less than (e.g., `field=lt:value`)
        - **`lte`**: Less than or equal to (e.g., `field=lte:value`)
        - **`in`**: Matches any value in a list (e.g., `field=in:value1,value2,value3`)
        - **`nin`**: Does not match any value in a list (e.g., `field=nin:value1,value2,value3`)

        > **Note:** When using `in` or `nin`, provide a **comma-separated list** of values.

        ### Example Requests

        - To find items where `field1` equals "VALUE" and `field2` is greater than 10:
          ```
          GET /path/to/resources?field1=eq:VALUE&field2=gt:10
          ```

        - To get servers with specific `id` values:
          ```
          GET /v3/servers?id=in:a7f147d7-474d-53de-8f98-25ceaaaac5d1,eda8c2c0-9bc1-5d0d-953f-80122114261f
          ```

        ## Sorting

        Sorting allows you to order the results based on one or more fields, in either ascending or descending order.

        ### How to Sort Data

        To apply sorting, use the `sortBy` parameter in the query string. Specify fields to sort by, followed by the order (`asc` or `desc`).

        - **`asc`**: Ascending order (lowest to highest).
        - **`desc`**: Descending order (highest to lowest).

        You can sort by multiple fields. For example, sorting by `userId` in ascending order and `registerDate` in descending order:

        ### Example Request:
        ```
        GET /v1/users?sortBy=asc:userId,desc:registerDate
        ```

        ## Status Codes

        The HTTP status code in the response indicates the result of your request. Here’s a list of common status codes and their meanings:

        | Status Code | Meaning |
        | ------------ | ------- |
        | **200**      | The request was successful and the resource was returned (usually for `GET` requests). |
        | **201**      | A resource was successfully created (usually after a `POST` request). |
        | **202**      | The request to change a resource was accepted (for `PUT` or `PATCH` requests). |
        | **204**      | The request was successful, but there is no content in the response (e.g., after a `DELETE` request). |
        | **400**      | There was an error in your request, but it's not a specific error defined in the status codes. |
        | **401**      | Authentication failed. You need to provide valid credentials. |
        | **402**      | Payment is required (rarely used). |
        | **403**      | You don't have permission to access this resource. |
        | **404**      | The resource you requested was not found. |
        | **405**      | The method you're using (e.g., `GET`, `POST`) is not allowed for the given URL. |
        | **409**      | There was a conflict while trying to modify the resource. |
        | **410**      | The resource is no longer available or has been permanently removed. |
        | **415**      | There’s a conflict with an existing resource that prevents the action. |
        | **422**      | There was a validation error with your input. |
        | **429**      | You have exceeded the rate limit and need to wait before making more requests. |
        | **500**      | There was an internal error on the server. |

        ## Response

        ### Headers

        The headers in the response contain additional information about the request and response. Some of the headers are **required**, while others are **optional**. Here are a few important ones:

        | Header Name | Description | Example |
        | ----------- | ----------- | ------- |
        | **`Sunset`** | Indicates if the API or resource is deprecated, with a date of removal. | `2024-01-01T00:00:00Z` |
        | **`X-AR-Request-Id`** | A unique identifier for your request, used for tracking and ensuring idempotency. | `4da5d7c1-9f87-5975-8f2d-d6f3c939e513` |

        ### Body Format

        The response body is typically in JSON format and contains the data you're looking for, along with any additional information like errors or metadata.

        Here’s the general structure of a JSON response:

        ```json
        {
          "message": "A human-readable message about the response",
          "data": "The actual data (an array, object, etc.) representing the resource(s)",
          "errors": [
            {
              "reason": "The error reason",
              "field": "The field that caused the error (optional)",
              "params": "Additional details about the error (optional)"
            }
          ],
          "meta": "Additional metadata about the response (optional)"
        }
        ```

        - The `message` provides a summary of the response.
        - The `data` contains the requested resource(s).
        - If there was an error with your request, the `errors` field will provide details.
        - The `meta` field contains any extra information about the response, such as pagination details.

        #### Error Format

        When there’s an error, it will be returned in the following format:

        ```json
        "errors": [
          {
            "reason": "The error reason",
            "field": "The field that caused the error (if applicable)",
            "params": "Additional details about the error (if applicable)"
          }
        ]
        ```

        - **Reason**: A description of the error (e.g., `INVALID_INPUT`, `MISSING_FIELD`).
        - **Field**: The specific field causing the error, if applicable (e.g., `username`).
        - **Params**: Extra details about the error, such as validation constraints.

        > **Note:** Error reasons will be listed in the API documentation, so you can easily look up and understand the meaning of any error.

        ## Pagination

        When requesting a list of resources, the response may include pagination information to help you retrieve the data in smaller chunks.

        There are two types of pagination available: **offset-based** and **cursor-based**.

        ### Offset-based Pagination

        This is a common pagination method where you specify the page number and the number of items per page.

        - **`perPage`**: Specifies the number of items per page.
        - **`page`**: Specifies which page to retrieve.

        Here’s an example response with offset-based pagination:

        ```json
        {
          "message": "Resources found",
          "data": [{}, {}, ...],
          "meta": {
            "pagination": {
              "perPage": 10,
              "current": 1,
              "totalItems": 100,
              "lastPage": 10,
              "next": 2,
              "previous": null
            }
          }
        }
        ```

        - **`perPage`**: Number of items per page (e.g., 10).
        - **`current`**: The current page number.
        - **`totalItems`**: The total number of items available.
        - **`lastPage`**: The last page number.
        - **`next`**: The next page number (if applicable).
        - **`previous`**: The previous page number (if applicable).

        ### Cursor-based Pagination

        This pagination method is preferred when dealing with large datasets. It uses a unique token to track pagination, rather than using page numbers.

        - **`perPage`**: Specifies the number of items per page.
        - **`nextPageToken`**: A unique token to fetch the next page of results.

        Here’s an example response with cursor-based pagination:

        ```json
        {
          "message": "Resources found",
          "data": [{}, {}, ...],
          "meta": {
            "pagination": {
              "perPage": 10,
              "nextPageToken": "<Random Token>|null"
            }
          }
        }
        ```

        - **`nextPageToken`**: The unique token used to retrieve the next set of results. If there are no more results, this token will be `null`.

        > **Example Request**: `/v1/users?perPage=10&nextPageToken=TLJgsnhcmUh`

        The `nextPageToken` refers to a unique, sequential key in your database that helps keep track of the pages.
      name: Introduction
    - description: |
        This section explains how to authenticate API requests. The API supports two methods of authentication: **API Key** and **Bearer Token**. These methods must be included in the `Authorization` header of your requests.

        ## API Key

        To authenticate using an API key, include the API key in the `Authorization` header in the following format:

        ```
        Authorization: apikey {uuid}
        ```

        - **`{uuid}`**: Your unique API key. You can obtain this key from the API provider's dashboard or management interface.

        **Example Request**:
        ```
        GET /v1/resources
        Authorization: apikey 123e4567-e89b-12d3-a456-426614174000
        ```

        ## Bearer Token

        Alternatively, you can authenticate using a Bearer token. To do so, include the token in the `Authorization` header in the following format:

        ```
        Authorization: Bearer {token}
        ```

        - **`{token}`**: The Bearer token you receive after successfully authenticating via the login or token endpoint. This token is typically short-lived, and you may need to refresh it periodically.

        **Example Request**:
        ```
        GET /v1/resources
        Authorization: Bearer abcdef1234567890
        ```

        Make sure that your API key or Bearer token is kept secure, as it grants access to sensitive data and actions on the API.
      name: Authentication
    - description: |
        Endpoints for managing compute instances (servers) in the application. Allows you to create, update, delete, and retrieve details about virtual machines (VMs), including their status, configuration, and metadata. Features include server creation from backups, managing server volumes, resizing, renaming, and performing rescue operations. You can also manage SSH keys, security groups, and network interfaces for servers.
      name: Servers
    - description: |
        Endpoints for managing network resources in the application. Includes functionality for creating and managing networks, subnets, and routing, as well as configuring network interfaces for virtual machines. You can attach and detach servers to/from networks, enable port security, and manage IP configurations and network routing for cloud resources.
      name: Networks
    - description: |
        Endpoints for managing resource plans or flavors in the application. Allows you to define and manage specifications for compute instances, such as CPU, RAM, and storage capacity, as well as pricing and performance tiers. Includes endpoints for retrieving available plans (flavors) and selecting the appropriate plan for instance creation or resizing.
      name: Plans
    - description: |
        Endpoints for managing firewall and security group settings in the application. Provides functionality to define, configure, and manage security policies, controlling access to compute instances and networks through rules-based firewalls. Includes managing security group rules, defining allowed protocols, ports, and IP addresses, as well as associating security groups with servers.
      name: SecurityGroups
    - description: |
        Endpoints for listing OS and application images in the application. Allows you retrieve images, enabling the creation of new virtual machines or server instances with predefined configurations, operating systems, and application stacks. Features include listing marketplace images, personal images, and snapshots for server backup and recovery purposes.
      name: Images
    - description: Endpoints for retrieving quotas and limits for each user.
      name: Quota
    - description: |
        Endpoints for managing SSH key settings in the application. Provides functionality to define, configure, and manage SSH keys.
      name: SSHKeys
    - description: |
        Endpoints for managing backups and backup schedules. The backups are currently  made only from instance root volumes. So backing up secondary volumes  is not supported. A Backup schedule is a feature which enables backups from instances to be created in a specific interval.
      name: Backups
    - description: |
        Endpoints for managing instance & volume snapshots. A snapshot is a point-in-time recovery method which only stores changes in data rather than all of the volume's data. Also creating and restoring a snapshot is faster than regular backups.
      name: Snapshots
    - description: "Endpoints for listing Availability Zones data and status. \n"
      name: AvailabilityZones
