components:
    schemas:
        AddFirewallRule:
            properties:
                availabilityZone:
                    example: eu-west1-a
                    type: string
                direction:
                    enum:
                        - INGRESS
                        - EGRESS
                    type: string
                etherType:
                    enum:
                        - IPV4
                        - IPV6
                    type: string
                portMax:
                    maximum: 65535
                    minimum: 1
                    type: integer
                portMin:
                    maximum: 65535
                    minimum: 1
                    type: integer
                protocol:
                    enum:
                        - ANY
                        - TCP
                        - UDP
                        - ICMP
                        - GRE
                        - SSH
                        - HTTP
                        - HTTPS
                        - MYSQL
                        - SMTP
                        - SMTPS
                        - IMAP
                        - POP3
                        - POP3S
                    type: string
                remoteIp:
                    format: ipv4
                    type: string
            required:
                - availabilityZone
                - direction
                - etherType
                - protocol
                - remoteIp
            type: object
        AttachNetwork:
            properties:
                availabilityZone:
                    description: availability zone of the network
                    type: string
                enablePortSecurity:
                    description: enable port security
                    type: boolean
                ip:
                    description: IP
                    type: string
                serverId:
                    description: server ID
                    type: string
                subnetId:
                    description: subnet id
                    type: string
            required:
                - availabilityZone
                - serverId
            type: object
        AttachSecurityGroup:
            properties:
                serverId:
                    type: string
            type: object
        AttachToServer:
            properties:
                availabilityZone:
                    example: ir-central1-a
                    type: string
                mountPoint:
                    example: /dev/vdb
                    type: string
                serverId:
                    format: uuid
                    type: string
            type: object
        CalculateFlavorPrice:
            properties:
                volumeSize:
                    example: 100
                    type: integer
            type: object
        ChangePassword:
            properties:
                availabilityZone:
                    type: string
            required:
                - availabilityZone
            type: object
        CreateFirewall:
            properties:
                availabilityZone:
                    example: eu-west1-a
                    type: string
                createDefaultRules:
                    type: boolean
                name:
                    type: string
            required:
                - availabilityZone
                - name
            type: object
        CreateImage:
            properties:
                availabilityZone:
                    type: string
                enableUefi:
                    type: boolean
                name:
                    type: string
                url:
                    type: string
            required:
                - availabilityZone
                - name
                - url
            type: object
        CreateNetwork:
            properties:
                availabilityZone:
                    description: availability zone
                    type: string
                cidr:
                    description: subnet cidr
                    type: string
                description:
                    description: network description
                    type: string
                dhcpEnabled:
                    description: enable dhcp
                    type: boolean
                dhcpRange:
                    description: dhcp range
                    type: string
                dnsNameservers:
                    description: nameservers
                    type: string
                gatewayEnabled:
                    description: enable gateway
                    type: boolean
                gatewayIp:
                    description: gateway address
                    type: string
                name:
                    description: name of the network
                    type: string
            required:
                - availabilityZone
                - cidr
                - name
            type: object
        CreateServer:
            properties:
                availabilityZone:
                    description: availability zone, the zone where the server will be created
                    type: string
                backupId:
                    description: Create server from a backup, given its ID, if set, the ImageId field will be ignored
                    format: uuid
                    type: string
                backupName:
                    description: The name of the schedulded backup if enabled
                    type: string
                enableBackup:
                    description: Enable schedulded backup for the created server, if true, enableBackup should contain a valid name for the backup schedule
                    type: boolean
                enableFailOver:
                    description: enable failover, if true, the server will be created in a high availability cluster, meaning that in a hardware failure, the server will be migrated to another node
                    type: boolean
                enableIpv4:
                    description: enable IPv4 on the server, this is required to assign IPv6 addresses to the server
                    type: boolean
                enableIpv6:
                    description: enable IPv6 on the server, IPv6 addresses can only be assigned if the IPv4 is enabled.
                    type: boolean
                firewallNames:
                    description: firewalls to attach to the server to
                    items:
                        type: string
                    type: array
                flavorId:
                    description: flavor id, can be found in the flavor list endpoint
                    example: g2-2-2-0
                    type: string
                imageId:
                    description: server os id, can be found in the image list endpoint
                    format: uuid
                    type: string
                initScript:
                    description: |-
                        initialization script for server, in bash format
                        this script will be run in, this feature is only available for linux based images
                    type: string
                name:
                    description: name of server
                    type: string
                networkIds:
                    description: list of networks to attach server to
                    items:
                        format: uuid
                        type: string
                    type: array
                rootVolumeSizeGigaBytes:
                    description: server root volume size, in gigabytes
                    type: integer
                secondaryVolumes:
                    description: server secondary volumes to be created and attached to the server
                    items:
                        properties:
                            description:
                                description: description of the volume
                                type: string
                            name:
                                description: name of volume
                                type: string
                            sizeGigaBytes:
                                description: size of the volume
                                maximum: 10000
                                minimum: 1
                                type: integer
                        required:
                            - name
                            - sizeGigaBytes
                        type: object
                    type: array
                sshKeyName:
                    description: name of ssh key
                    type: string
            required:
                - availabilityZone
                - flavorId
                - imageId
                - name
                - rootVolumeSizeGigaBytes
            type: object
        CreateVolume:
            properties:
                availabilityZone:
                    example: ir-west1-a
                    type: string
                name:
                    type: string
                serverId:
                    format: uuid
                    type: string
                sizeGigaBytes:
                    minimum: 1
                    type: integer
                type:
                    enum:
                        - SSD_G1
                        - HDD_G1
                    type: string
            required:
                - availabilityZone
                - name
                - sizeGigaBytes
            type: object
        DeleteFirewallRules:
            properties:
                availabilityZone:
                    example: eu-west1-a
                    type: string
                ruleIds:
                    description: 'required: true'
                    items:
                        format: uuid
                        type: string
                    type: array
            type: object
        DeleteFirewalls:
            properties:
                availabilityZone:
                    example: eu-west1-a
                    type: string
                firewallIds:
                    items:
                        format: uuid
                        type: string
                    type: array
            type: object
        DeleteImages:
            properties:
                availabilityZone:
                    type: string
                imageIds:
                    items:
                        type: string
                    type: array
            type: object
        DeleteNetwork:
            properties:
                availabilityZone:
                    description: availability zone of the network
                    type: string
            required:
                - availabilityZone
            type: object
        DeleteServers:
            properties:
                availabilityZone:
                    example: eu-west1-a
                    type: string
                serverIds:
                    description: list of server IDs to delete
                    items:
                        format: uuid
                        type: string
                    type: array
            type: object
        DeleteVolumes:
            properties:
                availabilityZone:
                    type: string
                volumeIds:
                    items:
                        type: string
                    type: array
            type: object
        DetachFromServer:
            properties:
                availabilityZone:
                    type: string
            type: object
        DetachNetwork:
            properties:
                availabilityZone:
                    description: availability zone of the network
                    type: string
                serverId:
                    description: Server ID
                    type: string
            required:
                - availabilityZone
                - serverId
            type: object
        DetachSecurityGroup:
            properties:
                serverId:
                    type: string
            type: object
        Detail:
            properties:
                availabilityZone:
                    description: availability zone, the zone where the server is created
                    example: eu-west1-a
                    type: string
                backupEnabled:
                    description: backup enabled, if true, the server will be backed up every periodically
                    type: boolean
                createDate:
                    description: creation date
                    format: date-time
                    type: string
                dedicatedServerClusterId:
                    description: cluster id, if the server is created in a dedicated server cluster, this will be the id of the dedicated server's cluster
                    format: uuid
                    type: string
                dedicatedServerId:
                    description: dedicated server id, if the server is created in a dedicated server cluster, this will be the id of the dedicated server
                    format: uuid
                    type: string
                failoverEnabled:
                    description: failover is enabled, if true, the server is in a high availability cluster, meaning that in a hardware failure, the server will be migrated to another node
                    type: boolean
                flavor:
                    description: flavor details
                    properties:
                        cpuCores:
                            example: 2
                            type: integer
                        id:
                            description: unique identifier of flavor, which can be retrieved via flavors API
                            example: g2-2-2-0
                            type: string
                        name:
                            example: g2-medium1
                            type: string
                        ramMegaBytes:
                            example: 2048
                            type: number
                        rootDiskGigaBytes:
                            example: 75
                            type: integer
                    type: object
                id:
                    description: unique identifier for server
                    format: uuid
                    type: string
                image:
                    description: image details
                    properties:
                        id:
                            description: unique identifier
                            format: uuid
                            type: string
                        name:
                            description: name
                            type: string
                        os:
                            description: operating system
                            type: string
                        version:
                            description: operating system version
                            type: string
                    type: object
                ipAddresses:
                    description: ip addresses of server
                    items:
                        properties:
                            ipAddress:
                                description: address
                                format: ipv4
                                type: string
                            isPublic:
                                description: is public
                                type: boolean
                            macAddress:
                                description: mac address
                                type: string
                            networkName:
                                description: network name
                                type: string
                            version:
                                description: ip version
                                enum:
                                    - "4"
                                    - "6"
                                format: int32
                                type: string
                        type: object
                    type: array
                name:
                    description: name of server
                    type: string
                sshKeyName:
                    description: server keyname
                    type: string
                state:
                    description: server's current state
                    enum:
                        - ACTIVE
                        - SHUTOFF
                        - SHELVED_OFFLOADED
                        - DELETING
                    type: string
                taskId:
                    description: server's task id
                    format: uuid
                    type: string
                taskState:
                    description: server task state
                    enum:
                        - VOLUME_CREATING
                        - CREATING
                        - BUILD
                    type: string
            type: object
        DiscardServerTask:
            properties:
                availabilityZone:
                    type: string
            required:
                - availabilityZone
            type: object
        Error:
            properties:
                errors:
                    items:
                        properties:
                            field:
                                type: string
                            params:
                                type: object
                            reason:
                                type: string
                        type: object
                    type: array
                message:
                    type: string
            type: object
        Meta:
            properties:
                pagination:
                    properties:
                        current:
                            description: Current page number
                            type: integer
                        perPage:
                            type: integer
                        totalItems:
                            type: integer
                    type: object
            type: object
        Pagination:
            properties:
                current:
                    description: Current page number
                    type: integer
                perPage:
                    type: integer
                totalItems:
                    type: integer
            type: object
        PowerOff:
            properties:
                availabilityZone:
                    type: string
            required:
                - availabilityZone
            type: object
        PowerOn:
            properties:
                availabilityZone:
                    type: string
            required:
                - availabilityZone
            type: object
        Reboot:
            properties:
                availabilityZone:
                    type: string
            required:
                - availabilityZone
            type: object
        RenameServer:
            properties:
                availabilityZone:
                    description: availability zone of the server
                    type: string
                name:
                    description: new server name
                    type: string
            required:
                - availabilityZone
            type: object
        Rescue:
            properties:
                availabilityZone:
                    description: availability zone of the server
                    type: string
                name:
                    description: The name of the rescue image
                    type: string
            required:
                - availabilityZone
            type: object
        ResizeRootDisk:
            properties:
                availabilityZone:
                    description: availability zone of the server
                    type: string
                newSizeGigaBytes:
                    description: new size in gigabytes
                    type: integer
            required:
                - availabilityZone
            type: object
