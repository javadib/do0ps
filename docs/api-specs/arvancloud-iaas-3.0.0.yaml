                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Response-response_PublicAPIDetails'
                    description: OK
                default:
                    description: ""
            summary: Get Firewall Details
            tags:
                - Firewalls
    /firewalls/{firewallId}/rules:
        post:
            description: Create a new firewall rule in the given firewall
            operationId: AddFirewallRule
            parameters:
                - description: Firewall ID
                  in: path
                  name: firewallId
                  required: true
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        schema:
