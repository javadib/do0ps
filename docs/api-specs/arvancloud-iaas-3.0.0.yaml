                    description: OK
                default:
                    description: ""
            summary: List Firewalls
            tags:
                - Firewalls
        post:
            description: Create a new firewall in a specific availabilityZone
            operationId: CreateFirewall
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateFirewall'
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Response-response_PublicAPICreate'
                    description: Created
                "402":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.KitError'
                    description: Payment Required
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/response.KitError'
                    description: Unprocessable Entity
                default:
                    description: ""
            summary: Create New Firewall
            tags:
                - Firewalls
    /firewalls/{firewallId}:
        get:
            description: Get the details of the given firewall
            operationId: GetFirewallDetails
            parameters:
                - description: Firewall ID
                  in: path
