name: Build and Publish Docker image

# Ported from javadib/sonar_srv's docker-publish.yml. Docker/GHCR steps are
# language-agnostic and mostly unchanged; version extraction is reworked since
# Go has no pyproject.toml-style manifest field to read the version from.
#
# Build the production image and push it to the GitHub Container Registry.
# Triggered ONLY after a release tag is created (v*.*.*), ensuring images are
# always built from a released version. Can also be triggered manually, or
# called as a reusable workflow from release.yml (which passes app_version
# explicitly, since at call time GITHUB_REF_NAME is the branch, not the tag
# that was just created).
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      app_version:
        description: "Version to tag the image with (no leading v). Omit to derive from the triggering git tag."
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Resolve app version
        id: version
        run: |
          if [ -n "${{ inputs.app_version }}" ]; then
            echo "app_version=${{ inputs.app_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "app_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.app_version }},enable={{is_default_branch}}

      # NOTE: expects the repo's Dockerfile (see issue #21) to have a final
      # stage literally named "runner", and to accept an APP_VERSION build arg
      # it can bake in via `-ldflags "-X main.version=$APP_VERSION"`.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
