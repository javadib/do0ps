name: CI

# Ported from javadib/sonar_srv's ci.yml, adapted from Python/uv to Go.
on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race -cover

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      # Run in its own job, separate from build-test, per golangci-lint-action's
      # own recommendation (parallel jobs, not a shared step) -- and it does its
      # own build/module caching, so setup-go's cache is disabled above.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
